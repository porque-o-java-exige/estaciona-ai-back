# Nome da aplicação no Spring Boot
spring.application.name=estacionaAI

# Conexão JDBC com o MySQL (cria o banco estaciona_dev automaticamente se não existir)
spring.datasource.url=jdbc:mysql://localhost:3306/estaciona_dev?createDatabaseIfNotExist=true&serverTimezone=UTC

# Usuário de acesso ao banco MySQL
spring.datasource.username=root

# Senha de acesso ao banco MySQL
spring.datasource.password=root

# Estratégia do Hibernate: apaga e recria todas as tabelas a cada reinício da aplicação
spring.jpa.hibernate.ddl-auto=create-drop

# Exibe as queries SQL executadas no console para facilidade de debug
spring.jpa.show-sql=true

# Porta onde o servidor HTTP do Spring Boot vai rodar
server.port=8080

# Caminho do arquivo de banner exibido no terminal quando a aplicação inicia
spring.banner.location=classpath:banner-dev.txt

# Executa scripts SQL de inicialização (data.sql) sempre que a aplicação subir
spring.sql.init.mode=always

# Força o Spring a rodar o script data.sql APÓS o Hibernate criar as tabelas
spring.jpa.defer-datasource-initialization=true

# Se houver algum erro no data.sql, a inicialização da aplicação é interrompida
spring.sql.init.continue-on-error=false

# Garante que os campos UUID do Java sejam armazenados como CHAR(36) no MySQL
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# CONFIGURAÇÕES DO AZURE BLOB STORAGE

# Connection String autenticada completa montada com seu AccountName e sua AccountKey
azure.storage.connection-string=DefaultEndpointsProtocol=https;AccountName="";AccountKey="";EndpointSuffix=core.windows.net

mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN}

# Nome do container público criado na Azure para armazenar as imagens do projeto
azure.storage.container-name=estaciona-ai-images
