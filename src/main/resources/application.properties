# Nome da aplicação no Spring Boot
spring.application.name=estacionaAI

# Porta onde o servidor HTTP do Spring Boot vai rodar (usa variável PORT em nuvem ou 8080 local)
server.port=${PORT:8080}

# Endpoint do Azure Key Vault onde estão os segredos
spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=https://estaciona-ai-kv.vault.azure.net/

# Conexão JDBC com o MySQL da Aiven (puxada do Key Vault)
spring.datasource.url=${db-url}
spring.datasource.username=${db-username}
spring.datasource.password=${db-password}

# Estratégia do Hibernate: atualiza o schema sem apagar os dados existentes na Aiven
spring.jpa.hibernate.ddl-auto=update

# Aguarda o Hibernate criar/atualizar as tabelas antes de executar o data.sql
spring.jpa.defer-datasource-initialization=true

# Executa o data.sql na inicialização para popular/atualizar os dados na Aiven
spring.sql.init.mode=always

# Desativa logs de SQL no console em produção
spring.jpa.show-sql=false

# Garante que os campos UUID do Java sejam armazenados como CHAR(36) no MySQL
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Chave secreta para assinatura dos tokens JWT (puxada do Key Vault)
application.security.jwt.secret-key=${jwt-secret}

# CONFIGURAÇÕES DO AZURE BLOB STORAGE
azure.storage.connection-string=${azure-storage-connection-string}
azure.storage.container-name=estaciona-ai-images

# CONFIGURAÇÃO DO MERCADO PAGO
mercadopago.access-token=${mercadopago-access-token}